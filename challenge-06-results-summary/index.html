<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="card">

          
            <div class="result">

                <h2>Your Result</h2>

                <div class="score">
                    <h1>76</h1>
                    <p>of 100</p>
                </div>

                <h2>Great</h2>

                <p class="description">
                    You scored higher than 65% of the people who have taken these tests.
                </p>

            </div>

           
            <div class="summary">

                <h2>Summary</h2>

                <div class="reaction">
                    <span>Reaction</span>
                    <p>80 / 100</p>
                </div>

                <div class="memory">
                    <span>Memory</span>
                    <p>92 / 100</p>
                </div>

                <div class="verbal">
                    <span>Verbal</span>
                    <p>61 / 100</p>
                </div>

                <div class="visual">
                    <span>Visual</span>
                    <p>72 / 100</p>
                </div>

                <button type="button">Continue</button>

            </div>

        </div>
    </main>
</body>
</html>
